services:
  - type: web
    name: foodrescue-cloud
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodrescue-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: foodrescue-db
    databaseName: foodrescue
    user: foodrescue_user
